name: Collect Wayback images

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_wayback_images.py"
      - ".github/workflows/collect-wayback-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect archived images
        run: python3 scripts/collect_wayback_images.py

      - name: Show summary
        if: always()
        run: |
          if [ -f wayback_output/summary.json ]; then
            cat wayback_output/summary.json
          fi

      - name: Upload recovered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-images
          path: wayback_output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
