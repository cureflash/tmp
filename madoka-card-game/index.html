<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Magical Duel Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="hud"><div id="turn"></div><div id="status"></div><button id="new-game">NEW DUEL</button></div>
  <main class="board">
    <section id="top-player" class="player top">
      <aside class="character-panel"><img class="character-image" alt=""><div class="character-name"></div><div class="passive"></div><div class="special-name"></div></aside>
      <div class="player-name"></div><div class="hand"></div><div class="field"></div>
    </section>
    <section class="center"><div id="chain-stack"></div><div id="actions"></div></section>
    <section id="bottom-player" class="player bottom">
      <div class="field"></div><div class="hand"></div><div class="player-name"></div>
      <aside class="character-panel"><img class="character-image" alt=""><div class="character-name"></div><div class="passive"></div><div class="special-name"></div></aside>
    </section>
  </main>
  <aside id="log" class="log"></aside>
  <div id="modal-backdrop" class="modal-backdrop hidden"><div id="modal" class="modal"></div></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
